indexpage:
  title: AI Data Engine documentation
  lead: "AI Data Engine is a metadata intelligence service, managed through NetApp Console, that scans your connected systems, builds a metadata catalog, and gives you the visibility and tools to optimize storage and govern data at scale. With governed AI access, supported AI clients can search that metadata through the Model Context Protocol (MCP)."
  summary: "AI Data Engine documentation covers how to deploy, connect data sources, and use AI Data Engine for storage optimization, metadata investigation, data governance, and governed AI access through MCP."
  keywords: ai data engine, aide, storage optimization, investigation, policies, data governance, NetApp Console, governed ai access, mcp, model context protocol
